[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logsanitizer"
version = "0.1.0.dev0"
description = "Offline-first local application for sanitizing application logs"
readme = "README.md"
requires-python = ">=3.10"
# Runtime uses the Python standard library only, so it runs without pip on site.
dependencies = []

[project.scripts]
logsanitizer = "logsanitizer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
