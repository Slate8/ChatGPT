name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_EMBED_VERSION: "3.12.10"
  # SHA-256 of python-3.12.10-embed-amd64.zip (MD5 cross-checked against python.org API).
  PYTHON_EMBED_SHA256: "4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3"

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m ruff check src tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  package:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Download and verify embeddable Python
        run: |
          file="python-${PYTHON_EMBED_VERSION}-embed-amd64.zip"
          curl -sSfL -o "$file" "https://www.python.org/ftp/python/${PYTHON_EMBED_VERSION}/$file"
          echo "${PYTHON_EMBED_SHA256}  $file" | sha256sum --check
      - run: python3 packaging/build_package.py --out dist --python-embed "python-${PYTHON_EMBED_VERSION}-embed-amd64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

  package-test-windows:
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
      - name: Unpack
        shell: pwsh
        run: Expand-Archive -Path (Get-ChildItem *-windows-x64.zip).FullName -DestinationPath app
      - name: Self-test with bundled Python
        shell: cmd
        run: |
          for /d %%D in (app\LogSanitizer-*) do set "APPDIR=%%D"
          call "%APPDIR%\cli.bat" selftest || exit /b 1
          set LOGSANITIZER_WORKERS=2
          call "%APPDIR%\cli.bat" selftest || exit /b 1
      - name: Web interface starts on loopback
        shell: pwsh
        run: |
          $app = (Get-ChildItem app -Directory)[0].FullName
          $proc = Start-Process -FilePath "$app\cli.bat" -ArgumentList "serve","--no-browser","--port","8765" -PassThru -NoNewWindow
          Start-Sleep -Seconds 5
          $page = Invoke-WebRequest -Uri "http://127.0.0.1:8765/" -UseBasicParsing
          if ($page.StatusCode -ne 200 -or $page.Content -notmatch "LogSanitizer") { throw "UI not served" }
          Stop-Process -Id $proc.Id -Force

  package-test-linux:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
      - run: unzip -q *-portable.zip -d app
      - run: app/LogSanitizer-*/cli.sh selftest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-test-windows, package-test-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "LogSanitizer ${GITHUB_REF_NAME}" \
            --notes "Windows: LogSanitizer-*-windows-x64.zip (enthält Python). Linux: *-portable.zip (Python 3.10+ nötig). Prüfsummen in SHA256SUMS.txt. Anleitung: ANLEITUNG.md im Paket." \
            *.zip SHA256SUMS.txt
